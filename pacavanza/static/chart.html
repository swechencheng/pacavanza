<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PACavanza Future Chart</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000000;
      color: #ddd;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
        "Helvetica Neue", Arial;
    }

    .buy {
      color: #4caf50;
      font-weight: 600;
    }

    .sell {
      color: #f44336;
      font-weight: 600;
    }

    #split-container {
      display: flex;
      flex-direction: row;
      gap: 12px;
      width: 100%;
      height: calc(100vh - 0px);
      padding: 0 10px;
      box-sizing: border-box;
    }

    .instrument-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 1px solid #333;
      border-radius: 4px;
      background: #0f1014;
      min-width: 0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
      background: #1a243d;
      border-bottom: 1px solid #333;
    }

    .panel-header h3 {
      margin: 0;
      font-size: 14px;
    }

    .chart-container {
      flex: 1;
      position: relative;
      width: 100%;
    }

    .trading-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 8px;
      background: #151b2e;
      border-bottom: 1px solid #333;
      align-items: center;
    }

    .spacer {
      flex: 1;
    }

    .volume-input {
      width: 40px;
      background: #0f172a;
      border: 1px solid #333;
      color: #ddd;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 14px;
      font-family: monospace;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .volume-input:hover {
      border-color: #444;
    }

    .volume-input:focus {
      border-color: #4caf50;
      box-shadow: 0 0 4px #4caf50;
    }

    button {
      background: #2a3455;
      border: 1px solid #444;
      color: #ddd;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    button:hover {
      background: #3b476b;
    }

    /* Status timer — inline in panel header */
    #status {
      color: #ff9900;
      font-weight: bold;
      font-family: monospace;
      font-size: 13px;
      text-align: center;
      flex: 1;
      /* push OHLC info to the right */
    }

    .nav-links a {
      color: #6bebff;
      text-decoration: none;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

    .header-link {
      color: #6bebff;
      text-decoration: none;
      transition: color 0.2s ease-in-out;
    }

    .header-link:hover {
      color: #ffffff;
    }

    /* ── Drawing Toolbar ──────────────────────────────────── */
    .pac-drawing-toolbar {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding: 4px 2px;
      background: #1e222d;
      border-right: 1px solid #2a2e39;
      border-bottom-right-radius: 6px;
      box-shadow: 2px 0 8px rgba(0, 0, 0, .45);
      max-height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .pac-drawing-toolbar::-webkit-scrollbar {
      width: 0;
    }

    .pac-dt-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #787b86;
      cursor: pointer;
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }

    .pac-dt-btn:hover {
      background: #2a2e39;
      color: #d1d4dc;
    }

    .pac-dt-btn.active {
      background: #2962ff;
      color: #fff;
    }

    .pac-dt-btn-danger:hover {
      background: #5b1a1a;
      color: #f44336;
    }

    .pac-dt-sep {
      width: 20px;
      height: 1px;
      background: #363a45;
      margin: 3px 0;
      flex-shrink: 0;
    }

    /* ── Order Lifecycle Panel ──────────────────────────────── */
    .order-panel {
      background: #0d1117;
      border-top: 1px solid #333;
      height: 150px;
      flex-shrink: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #333 #0d1117;
    }

    .order-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
      background: #161b22;
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      border-bottom: 1px solid #21262d;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .order-list {
      font-size: 11px;
      font-family: monospace;
    }

    .order-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-bottom: 1px solid #161b22;
      transition: background 0.15s;
    }

    .order-row:hover {
      background: #161b22;
    }

    .order-row .tag {
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
    }

    .order-row .tag-buy {
      background: #0d4429;
      color: #4caf50;
    }

    .order-row .tag-sell {
      background: #4a1c1c;
      color: #f44336;
    }

    .order-row .tag-type {
      background: #1c2541;
      color: #6bebff;
    }

    .order-row .order-price-input {
      width: 55px;
      background: #0f172a;
      border: 1px solid #333;
      color: #ddd;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 10px;
      font-family: monospace;
      outline: none;
    }

    .order-row .order-price-input:focus {
      border-color: #4caf50;
    }

    .order-row .order-btn {
      background: #21262d;
      border: 1px solid #333;
      color: #8b949e;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 10px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .order-row .order-btn:hover {
      background: #30363d;
      color: #ddd;
    }

    .order-row .order-btn-danger:hover {
      background: #4a1c1c;
      color: #f44336;
    }

    .order-row .order-btn-market:hover {
      background: #1c3d2e;
      color: #4caf50;
    }

    .order-row-fulfilled {
      color: #b388ff !important;
      background: rgba(106, 27, 154, 0.1) !important;
      border-color: rgba(179, 136, 255, 0.2) !important;
    }

    .order-row-fulfilled:hover {
      background: rgba(106, 27, 154, 0.18) !important;
    }

    .order-row-fulfilled .order-price-input {
      color: #b388ff !important;
      border-color: rgba(179, 136, 255, 0.3) !important;
      background: rgba(106, 27, 154, 0.05) !important;
    }

    .order-empty {
      padding: 8px;
      color: #484f58;
      text-align: center;
      font-style: italic;
    }
  </style>

  <script src="https://unpkg.com/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://unpkg.com/lightweight-charts-drawing@0.1.1/dist/lightweight-charts-drawing.umd.js"></script>
</head>

<body>
  <div id="split-container">
    <div id="panel-future" class="instrument-panel">
      <div class="panel-header">
        <h3 style="color: #6bebff; margin:0; white-space:nowrap;">
          <a href="/ava" class="header-link" title="Go to AVA Mini's"><span id="label-future"></span></a>
        </h3>
        <span id="status">Disconnected</span>
        <span id="chart-ohlc-info-future"></span>
      </div>
      <div class="trading-controls" data-side="future">
        <label>
          📦
          <input type="number" id="order-contracts-future" value="1" min="1" step="1" class="volume-input" />
        </label>
        <button id="btn-buy-stop-future"><span class="buy">B</span> Stop</button>
        <button id="btn-cancel-buy-stop-future">❌</button>
        <button id="btn-sell-stop-future"><span class="sell">S</span> Stop</button>
        <button id="btn-cancel-sell-stop-future">❌</button>
        <button id="btn-late-buy-stop-future"><span class="buy">B</span> Late</button>
        <button id="btn-late-sell-stop-future"><span class="sell">S</span> Late</button>
        <button id="btn-delete-stop-losses-future">❌ SL</button>
        <div class="spacer"></div>
        <button id="btn-market-buy-future"><span class="buy">B</span> Market</button>
        <button id="btn-market-sell-future"><span class="sell">S</span> Market</button>
      </div>
      <!-- OCA Bracket Controls -->
      <div class="trading-controls" data-side="future" style="border-top: none;">
        <label style="font-size:11px; color:#888;">OCA:</label>
        <label style="font-size:11px;">
          <span class="sell">SL</span>
          <input type="number" id="oca-stop-price" value="" step="0.25" class="volume-input" style="width:80px;"
            placeholder="Stop" />
        </label>
        <label style="font-size:11px;">
          <span class="buy">TP</span>
          <input type="number" id="oca-limit-price" value="" step="0.25" class="volume-input" style="width:80px;"
            placeholder="Limit" />
        </label>
        <select id="oca-action" class="volume-input" style="width:40px;">
          <option value="SELL"><span class="sell">S</span></option>
          <option value="BUY"><span class="buy">B</span></option>
        </select>
        <button id="btn-place-oca">📎</button>

        <div class="spacer"></div>

        <label style="font-size:11px;">
          LMT:
          <input type="number" id="limit-order-price" value="" step="0.25" class="volume-input" style="width:80px;"
            placeholder="Price" />
        </label>
        <button id="btn-buy-limit-future"><span class="buy">B</span> Limit</button>
        <button id="btn-sell-limit-future"><span class="sell">S</span> Limit</button>
      </div>
      <div id="chart-future" class="chart-container"></div>
      <!-- Order Lifecycle Panel -->
      <div id="order-panel" class="order-panel">
        <div class="order-panel-header">
          <span>📋 Active Orders</span>
          <button id="btn-refresh-orders" style="font-size:10px; padding:2px 6px;">🔄</button>
        </div>
        <div id="order-list" class="order-list"></div>
      </div>
    </div>
  </div>


  <script src="/static/chart_core.js"></script>
  <script src="/static/drawing_tools.js"></script>
  <script src="/static/future_chart.js"></script>
</body>

</html>

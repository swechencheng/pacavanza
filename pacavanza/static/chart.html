<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PACavanza Realtime Chart</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #0b1220;
        color: #ddd;
      }
      #chart {
        height: 80vh;
        width: 100%;
      }
      #controls {
        padding: 6px;
      }
      .status {
        margin-left: 12px;
        color: #ffcc66;
      }
      .small {
        font-size: 12px;
        color: #888;
        margin-left: 6px;
      }
      /* ADD TOOLTIP STYLING FOR CONTROLS LINE */
      #chart-tooltip {
        margin-left: 12px;
        padding: 4px 8px;
        background: #1a243d;
        border-radius: 4px;
        font-size: 12px;
        font-family: monospace;
      }
    </style>

    <script src="https://unpkg.com/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <div id="controls">
      <label>Stock: <input id="stock" value="mini-l-omx-ava-468" /></label>
      <button id="load">Load</button>
      <span id="status" class="status">Disconnected</span>
      <span id="chart-tooltip"></span>
    </div>

    <div id="chart"></div>

    <script src="/static/chart.js"></script>
  </body>
</html>

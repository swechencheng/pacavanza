<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PACavanza Active Future Chart</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #000000;
        color: #ddd;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial;
      }

      .buy {
        color: #4caf50;
        font-weight: 600;
      }

      .sell {
        color: #f44336;
        font-weight: 600;
      }

      #split-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100vh;
        padding: 10px;
        box-sizing: border-box;
      }

      .instrument-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        border: 1px solid #333;
        border-radius: 4px;
        background: #0f1014;
        min-height: 0;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 8px;
        background: #1a243d;
        border-bottom: 1px solid #333;
      }

      .panel-header h3 {
        margin: 0;
        font-size: 14px;
      }

      .chart-container {
        flex: 1;
        position: relative;
        width: 100%;
      }

      #market-timer {
        position: fixed;
        top: 15px;
        right: 15px;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.6);
        padding: 4px 8px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 14px;
        color: #ddd;
        border: 1px solid #333;
        pointer-events: none;
      }

      #status {
        color: #ff9900;
        font-weight: bold;
      }
      
      .nav-links {
        position: fixed;
        bottom: 15px;
        right: 15px;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.6);
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 13px;
        border: 1px solid #333;
      }
      
      .nav-links a {
        color: #6bebff;
        text-decoration: none;
      }
      
      .nav-links a:hover {
        text-decoration: underline;
      }
    </style>

    <script src="https://unpkg.com/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <div id="split-container">
      <div id="panel-future" class="instrument-panel">
        <div class="panel-header">
          <h3 style="color: #6bebff;">FUTURE <span id="label-future">Loading...</span></h3>
          <span id="chart-ohlc-info-future"></span>
        </div>
        
        <div id="chart-future" class="chart-container"></div>
      </div>
    </div>

    <!-- Global Status/Info -->
    <div id="market-timer">
      <span id="status">Connecting...</span>
    </div>
    
    <!-- Link to the old mini trading UI -->
    <div class="nav-links">
      <a href="/ava">Go to Trading Minis</a>
    </div>

    <script src="/static/future_chart.js"></script>
  </body>
</html>

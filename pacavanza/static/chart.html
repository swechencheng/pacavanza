<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PACavanza Realtime Chart</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #0b1220;
        color: #ddd;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial;
      }

      .buy {
        color: #4caf50;
        font-weight: 600;
      }

      .sell {
        color: #f44336;
        font-weight: 600;
      }
      .volume-input {
        width: 60px;
        background: #0f172a; /* deep dark tone */
        border: 1px solid #333;
        color: #ddd;
        padding: 4px 6px;
        border-radius: 6px;
        font-size: 14px;
        font-family: monospace;
        outline: none;
        transition: border 0.2s, box-shadow 0.2s;
      }

      .volume-input:hover {
        border-color: #444;
      }

      .volume-input:focus {
        border-color: #4caf50; /* match buy color */
        box-shadow: 0 0 4px #4caf50;
      }

      #chart {
        height: 80vh;
        width: 100%;
      }

      #controls {
        padding: 6px 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      #controls select,
      #controls input {
        background: #1a243d;
        border: 1px solid #333;
        color: #ddd;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 14px;
      }

      #chart-ohlc-info {
        padding: 4px 8px;
        background: #1a243d;
        border-radius: 4px;
        font-size: 12px;
        font-family: monospace;
      }

      #trading-panel {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto; /* push to right */
      }

      #trading-panel button {
        background: #1a243d;
        border: 1px solid #333;
        color: #ddd;
        padding: 6px 10px;
        border-radius: 6px;
        font-weight: 500;
        cursor: pointer;
      }

      #trading-panel button:hover {
        background: #273455;
      }

      #status {
        position: fixed;
        top: 8px;
        right: 12px;
        background: rgba(26, 36, 61, 0.9);
        color: #ffcc66;
        padding: 4px 6px;
        border-radius: 6px;
        font-weight: 600;
        z-index: 5000;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }

      #trade-info {
        position: fixed;
        top: 40px;
        right: 12px;
        background: rgba(26, 36, 61, 0.9);
        color: #ddd;
        padding: 4px 6px;
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }

      @media (max-width: 600px) {
        #controls {
          flex-direction: column;
          align-items: flex-start;
        }
        #trading-panel {
          width: 100%;
          justify-content: flex-start;
          margin-left: 0;
        }
      }
    </style>

    <script src="https://unpkg.com/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <div id="controls">
      <label>
        <select id="instrument"></select>
      </label>
      <span id="chart-ohlc-info"></span>
    </div>

    <div id="trading-panel">
      <label>
        💰
        <input
          type="number"
          id="order-percentage"
          value="15.00"
          min="0.01"
          step="0.01"
          class="volume-input"
        />
        %
      </label>
      <button id="btn-buy-stop"><span class="buy">B</span> Stop</button>
      <button id="btn-cancel-buy-stop">❌</button>
      <button id="btn-sell-stop"><span class="sell">S</span> Stop</button>
      <button id="btn-cancel-sell-stop">❌</button>
      <button id="btn-late-buy-stop">
        <span class="buy">B</span> Stop Late
      </button>
      <button id="btn-late-sell-stop">
        <span class="sell">S</span> Stop Late
      </button>
      <button id="btn-market-buy"><span class="buy">B</span> Market</button>
      <button id="btn-market-sell"><span class="sell">S</span> Market</button>
    </div>

    <div id="chart"></div>

    <span id="status">Disconnected</span>
    <span id="trade-info">...</span>

    <script src="/static/chart.js"></script>
    <script src="/static/trading.js"></script>
  </body>
</html>
